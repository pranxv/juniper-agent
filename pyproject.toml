[project]
name = "booking-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kushal Pranav Kumar Gangupomu", email = "kushalpranavkumar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
]

[project.scripts]
booking-agent = "booking_agent:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
[tool.ruff.lint]
extend-select = ["I", "B"]   # I = sort imports, B = bugbear (includes B904)